name: veil
description: "Veil — приватный мессенджер. Все сообщения хранятся только на телефоне."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  bip340: ^0.3.1
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_secure_storage: ^11.2.0
  mobile_scanner: ^7.4.2
  path: ^1.9.1
  pointycastle: ^4.0.0
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  sqflite: ^2.4.4+1
  web_socket_channel: ^3.0.3
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
