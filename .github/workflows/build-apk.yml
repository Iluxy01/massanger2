# Собирает APK в облаке GitHub при каждом пуше.
# Готовый файл: вкладка Actions → последний запуск → Artifacts → veil-apk.
# Если запушить тег вида v0.1.0 — APK ещё и появится в Releases.
name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Живая проверка бесплатных ретрансляторов (результат — в логе этого шага).
      - name: Проверка ретрансляторов
        run: flutter test test/media_probe_test.dart test/network_e2e_test.dart test/network_test.dart --reporter expanded
        env:
          VEIL_NETWORK_TEST: '1'
        continue-on-error: true

      # Подпись постоянным ключом (необязательно, см. README → «Постоянная подпись»).
      - name: Подготовить ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=upload
          storeFile=upload-keystore.jks
          PROPS

      - run: flutter build apk --release

      - name: Переименовать APK
        run: cp build/app/outputs/flutter-apk/app-release.apk veil.apk

      - uses: actions/upload-artifact@v4
        with:
          name: veil-apk
          path: veil.apk

      - name: Релиз (только для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: veil.apk
